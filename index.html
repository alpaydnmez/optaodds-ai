<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptaOdds AI v5.6 - 6'lı Oran DNA Motoru & Arşiv</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#080c14] text-slate-200 min-h-screen flex flex-col selection:bg-emerald-500/30 selection:text-emerald-300">

  <!-- TOP STATUS BAR -->
  <div class="bg-slate-950 border-b border-slate-800/80 px-4 py-2 text-xs flex flex-wrap justify-between items-center text-slate-400">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="font-bold text-slate-200">OptaOdds Pro v5.6:</span>
      <span>Tescilli 6'lı Oran DNA'sı [1X2 | 2.5Ü/A | KGV/Y]</span>
    </div>
    <div class="flex items-center gap-4 font-mono text-[11px]">
      <span id="header-date" class="text-slate-300">📅 23.10.2026 Cuma</span>
      <span class="text-emerald-400">Brier: 0.1235</span>
      <span class="text-purple-400">VIP İsabet: %70.0</span>
    </div>
  </div>

  <!-- HEADER -->
  <header class="bg-slate-900/70 backdrop-blur sticky top-0 z-40 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center font-mono font-bold text-emerald-400">Ω</div>
        <div>
          <div class="font-bold text-base text-white flex items-center gap-2">
            <span>OptaOdds Pro</span>
            <span class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded font-mono">v5.6 LIVE</span>
          </div>
          <div class="text-[11px] text-slate-400">6 Parametreli Oran Eşleştirme Motoru • GitHub Pages Canlı</div>
        </div>
      </div>
      <button onclick="sendTelegramDirect()" class="px-3.5 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-600 text-white font-semibold text-xs transition flex items-center gap-1.5 shadow-sm shadow-sky-500/20">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        <span>Telegram'a Gönder</span>
      </button>
    </div>

    <!-- TABS -->
    <div class="border-t border-slate-800/60 bg-slate-950/40 px-4 py-1.5 flex gap-2 overflow-x-auto text-xs">
      <button onclick="switchTab('bulletin')" id="btn-bulletin" class="tab-btn px-3 py-1.5 rounded-md font-medium text-white bg-slate-800">Günün Bülteni & 6'lı DNA</button>
      <button onclick="switchTab('vip')" id="btn-vip" class="tab-btn px-3 py-1.5 rounded-md font-medium text-amber-300 hover:text-white">⭐ VIP 1.90 – 2.80 Odası</button>
      <button onclick="switchTab('rolling')" id="btn-rolling" class="tab-btn px-3 py-1.5 rounded-md font-medium text-emerald-300 hover:text-white">💰 Rolling Kasa (250 ➔ 562 TL)</button>
      <button onclick="switchTab('archive')" id="btn-archive" class="tab-btn px-3 py-1.5 rounded-md font-medium text-purple-300 hover:text-white">📚 Kapsamlı Arşiv</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 max-w-7xl mx-auto px-4 py-5 w-full space-y-4">
    <!-- TAB 1: BÜLTEN -->
    <section id="tab-bulletin" class="tab-pane space-y-3">
      <div id="bulletin-list" class="space-y-3"></div>
    </section>

    <!-- TAB 2: VIP -->
    <section id="tab-vip" class="tab-pane hidden space-y-3">
      <div id="vip-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </section>

    <!-- TAB 3: ROLLING -->
    <section id="tab-rolling" class="tab-pane hidden space-y-3">
      <div id="rolling-card" class="bg-slate-900/60 border border-emerald-500/30 p-5 rounded-xl"></div>
    </section>

    <!-- TAB 4: ARŞİV -->
    <section id="tab-archive" class="tab-pane hidden space-y-3">
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl overflow-hidden">
        <table class="w-full text-xs text-left">
          <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
            <tr>
              <th class="p-3">Tarih</th>
              <th class="p-3">Maç</th>
              <th class="p-3">Skor</th>
              <th class="p-3">Tercih</th>
              <th class="p-3">Sonuç</th>
            </tr>
          </thead>
          <tbody id="archive-table" class="divide-y divide-slate-800/60 font-mono"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    let appData = {};

    async function init() {
      try {
        const res = await fetch('data.json');
        appData = await res.json();
      } catch (e) {
        console.warn("data.json okunamadı.");
      }
      render();
    }

    function render() {
      if (!appData.matches) return;
      document.getElementById('header-date').innerText = `📅 ${appData.current_date} Cuma`;

      const bList = document.getElementById('bulletin-list');
      bList.innerHTML = appData.matches.map(m => `
        <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-xl flex flex-wrap justify-between items-center gap-3">
          <div>
            <div class="text-[11px] text-slate-400">${m.league} • ${m.time}</div>
            <div class="text-sm font-bold text-white">${m.match}</div>
            <div class="text-[11px] font-mono text-emerald-400 mt-1">DNA [1X2|2.5|KG]: ${m.odds_dna}</div>
            <div class="text-[10px] text-slate-400">Eşleşen Geçmiş: ${m.history_matches ? m.history_matches.join(', ') : '2+ maç'}</div>
          </div>
          <div class="text-right">
            <div class="text-xs text-amber-400 font-semibold">${m.prediction}</div>
            <div class="text-lg font-mono font-bold text-white">@ ${m.odds}</div>
            <div class="text-[10px] text-slate-400">Güven: %${m.confidence}</div>
          </div>
        </div>
      `).join('');

      const vList = document.getElementById('vip-list');
      vList.innerHTML = (appData.vip_room || []).map(v => `
        <div class="bg-slate-900/60 border border-amber-500/30 p-4 rounded-xl">
          <div class="text-xs text-amber-400 font-bold">${v.league}</div>
          <div class="text-sm font-bold text-white mt-1">${v.match}</div>
          <div class="mt-2 flex justify-between items-center">
            <span class="text-xs font-semibold text-emerald-400">${v.prediction}</span>
            <span class="text-base font-mono font-bold text-white">@ ${v.odds}</span>
          </div>
          <div class="text-[11px] text-slate-400 mt-2 border-t border-slate-800 pt-2">${v.reason}</div>
        </div>
      `).join('');

      const rCard = document.getElementById('rolling-card');
      if (appData.rolling_kasa) {
        const r = appData.rolling_kasa;
        rCard.innerHTML = `
          <div class="flex justify-between items-center mb-3">
            <span class="text-sm font-bold text-emerald-400">Rolling Kasa - Adım ${r.current_step}</span>
            <span class="text-xs font-mono bg-emerald-500/20 text-emerald-300 px-2 py-1 rounded">Hedef: ${r.target_amount} TL</span>
          </div>
          <div class="text-2xl font-bold font-mono text-white mb-3">${r.current_amount} TL ➔ Toplam Oran: ${r.total_odds}</div>
          <div class="space-y-2">
            ${r.picks.map(p => `
              <div class="flex justify-between text-xs bg-slate-950 p-2.5 rounded border border-slate-800">
                <span><b>${p.match}</b> ➔ ${p.pick}</span>
                <span class="font-mono text-emerald-400 font-bold">@ ${p.odds}</span>
              </div>
            `).join('')}
          </div>
        `;
      }

      const aTable = document.getElementById('archive-table');
      aTable.innerHTML = (appData.archive || []).map(a => `
        <tr class="hover:bg-slate-800/30">
          <td class="p-3 text-slate-400">${a.date}</td>
          <td class="p-3 text-white font-medium">${a.match}</td>
          <td class="p-3 text-amber-300">${a.score}</td>
          <td class="p-3 text-slate-300">${a.pick}</td>
          <td class="p-3 ${a.result.includes('TUTTU') ? 'text-emerald-400 font-bold' : 'text-rose-400'}">${a.result}</td>
        </tr>
      `).join('');
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('bg-slate-800', 'text-white'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');
      document.getElementById('btn-' + tabId).classList.add('bg-slate-800', 'text-white');
    }

    async function sendTelegramDirect() {
      const btn = event.currentTarget;
      btn.disabled = true;
      btn.innerText = "Gönderiliyor...";
      
      let text = `⚡ <b>OPTAODDS AI v5.6 BÜLTENİ</b> ⚡\n📅 <b>Tarih:</b> ${appData.current_date}\n───────────────────────\n`;
      (appData.matches || []).forEach(m => {
        text += `• <b>${m.match}</b> (${m.league})\n  👉 <b>Tercih:</b> ${m.prediction} (@ ${m.odds}) [Güven: %${m.confidence}]\n\n`;
      });
      text = text.replace(/&/g, 've');

      try {
        const res = await fetch(`https://api.telegram.org/bot8922109226:AAGCEVmDNyCf2DMLhnOi1Mh2hYLp5WdV_tc/sendMessage`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            chat_id: '867372590',
            text: text,
            parse_mode: 'HTML'
          })
        });
        if (res.ok) alert("Bülten Telegram'a iletildi!");
        else alert("Telegram API hatası oluştu.");
      } catch (err) {
        alert("Hata: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Telegram'a Gönder";
      }
    }

    init();
  </script>
</body>
</html>
