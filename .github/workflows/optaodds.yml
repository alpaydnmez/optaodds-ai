name: OptaOdds AI Daily Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * *'
    - cron: '15 9 * * *'
    - cron: '15 13 * * *'

permissions:
  contents: write

jobs:
  optaodds-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Auto Engine & Send Single Telegram Notification
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: "8922109226:AAGCEVmDNyCf2DMLhnOi1Mh2hYLp5WdV_tc"
          TELEGRAM_CHAT_ID: "867372590"
        run: python3 scripts/auto_engine.py || true
