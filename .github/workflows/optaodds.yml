name: OptaOdds Daily Auto Engine

on:
  schedule:
    # Her gün TSİ 01:30, 12:30 ve 18:30'da otomatik çalışır (UTC karşılıkları)
    - cron: '30 22 * * *'
    - cron: '30 9 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch: # İstediğin an tek tıkla elle tetikleme

permissions:
  contents: write

jobs:
  update-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 pytz

      - name: Run Auto Engine
        env:
          TG_BOT_TOKEN: "8922109226:AAGCEVmDNyCf2DMLhnOi1Mh2hYLp5WdV_tc"
          TG_CHAT_ID: "867372590"
        run: |
          python engine.py

     - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto Update Bulletin [skip ci]" || exit 0
          git push
