name: OptaOdds AI Otomasyon Motoru

on:
  schedule:
    # TSİ = UTC+3
    # 01:15 TSİ -> 22:15 UTC
    - cron: '15 22 * * *'
    # 12:15 TSİ -> 09:15 UTC
    - cron: '15 9 * * *'
    # 16:15 TSİ -> 13:15 UTC
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      shift:
        description: 'Çalıştırılacak Vardiya'
        required: true
        default: 'afternoon'
        type: choice
        options:
          - night
          - midday
          - afternoon

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: OptaOdds Motorunu Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL_SHIFT: ${{ github.event.inputs.shift }}
        run: |
          python scripts/auto_engine.py

      - name: Güncellenen Verileri Commit Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "OptaOdds AI Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: OptaOdds Kütük Güncellemesi [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
