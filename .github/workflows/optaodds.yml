          req_data = urllib.parse.urlencode({"chat_id": chat_id, "text": msg}).encode("utf-8")
          req = urllib.request.Request(url, data=req_data, method="POST")
          with urllib.request.urlopen(req, timeout=15) as resp:
              print("Telegram response:", resp.read().decode("utf-8"))
          EOF

      - name: Commit and Push updated data.json
        run: |
          git config user.name "OptaOdds AI Bot"
          git config user.email "bot@optaodds.ai"
          git add data.json
          git diff --staged --quiet || (git commit -m "Auto-update: 25.10.2026 Pazar bulletin + 24.10.2026 archive" && git pull --rebase -X theirs origin main && git pull --rebase origin main && git push origin main)
